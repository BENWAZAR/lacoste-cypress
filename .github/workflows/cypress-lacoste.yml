name: Lacoste Cypress Automation

on:
  workflow_dispatch:

jobs:
  cypress-tests:
    name: E2E Tests - Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Verify Cypress installation
      - name: Verify Cypress
        run: npx cypress verify

      # 5. Execute Cypress tests
      - name: Run Cypress tests
        run: npm run cy:chrome

      # 6. Upload HTML report
      - name: Upload Cypress HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lacoste-cypress-html-report
          path: cypress/reports/
          if-no-files-found: warn
          retention-days: 14

      # 7. Upload screenshots
      - name: Upload Cypress Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lacoste-cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # 8. Upload videos
      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lacoste-cypress-videos
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 14
